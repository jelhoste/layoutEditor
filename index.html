<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Constructeur de layout</title>
<style>
:root{--bg:#eef0f3;--pn:#fff;--tx:#1b2230;--mut:#667086;--bd:#d5d9e1;--ac:#2f6fed;--acs:#e3ebff;--cv:#fafbfd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--pn:#1c1f27;--tx:#e6e9f0;--mut:#8a93a6;--bd:#2d323e;--ac:#6f96ff;--acs:#25304f;--cv:#0f1116}}
:root[data-theme="dark"]{--bg:#12141a;--pn:#1c1f27;--tx:#e6e9f0;--mut:#8a93a6;--bd:#2d323e;--ac:#6f96ff;--acs:#25304f;--cv:#0f1116}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--pn);border:1px solid var(--bd);border-radius:5px;padding:4px 9px;cursor:pointer}
button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select,textarea{background:var(--pn);border:1px solid var(--bd);border-radius:5px;padding:3px 6px;min-width:0}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd)}
header input[type=number]{width:64px}.sp{flex:1}.seg{display:flex}.seg button{border-radius:0}.seg button:first-child{border-radius:5px 0 0 5px}.seg button:last-child{border-radius:0 5px 5px 0}
header label{display:flex;gap:4px;align-items:center}
aside{background:var(--pn);overflow:auto;padding:10px}#L{border-right:1px solid var(--bd)}#P{position:fixed;z-index:20;inset:0;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 28px;max-width:960px;margin:12px auto;align-items:start}.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:960px;margin:0 auto}#zb{min-width:84px;user-select:none;-webkit-user-select:none;touch-action:none}#P[hidden]{display:none}#ins{position:fixed;z-index:9;background:var(--ac);pointer-events:none;border-radius:2px}.ct.fold .bd{padding:3px;justify-content:center;align-items:center}button:disabled{opacity:.4;cursor:default}#pop{position:fixed;z-index:15;width:230px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;padding:6px;overflow:auto;background:var(--pn);border:1px solid var(--bd);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.22)}#pop[hidden]{display:none}#pop>button{text-align:left}#pop small{padding:2px 4px}
.r2{display:flex;gap:6px;margin-bottom:8px}.r2>*{flex:1}
.mut,small{color:var(--mut)}h3{margin:0 0 8px;font-size:13px}hr{border:0;border-top:1px solid var(--bd);margin:10px 0}
#P label{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;font-size:11px;color:var(--mut)}#P label.k{flex-direction:row;align-items:center;gap:6px}
#P label input,#P label select{font-size:13px;color:var(--tx)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.tc,.te{padding:3px 6px;border-radius:4px;cursor:pointer}.te{margin-left:14px}.tc{font-weight:600;margin-top:4px}.tc.on,.te.on{background:var(--acs)}.dim{opacity:.4}
#stage{overflow:auto;padding:20px 28px 28px 20px;touch-action:pan-x pan-y}
#wrap{position:relative}
#cv{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--cv);border:1px solid var(--bd);box-shadow:0 2px 14px rgba(0,0,0,.12);overflow:hidden}#cv.edit{touch-action:none}.mv{display:none;position:absolute;left:8px;width:44px;height:22px;line-height:22px;text-align:center;font-size:14px;color:#fff;background:var(--ac);border-radius:6px;cursor:move;touch-action:none}.edit .mv{display:block}.mv.up{bottom:100%;margin-bottom:3px}.mv.dn{top:100%;margin-top:3px}.mv.in{top:3px}
.h{position:absolute;background:var(--ac);opacity:.35;border-radius:4px;touch-action:none}.h:hover{opacity:.8}
.h[data-h=r]{right:-9px;top:0;bottom:0;width:7px;cursor:ew-resize}.h[data-h=b]{bottom:-9px;left:0;right:0;height:7px;cursor:ns-resize}.h[data-h=c]{right:-9px;bottom:-9px;width:12px;height:12px;cursor:nwse-resize}
.ct{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;background:var(--pn);border:1px solid var(--bd);border-radius:6px}
.ct.sel{outline:2px solid var(--ac)}
.hd{height:25px;flex:none;display:flex;align-items:center;gap:5px;padding:0 7px;font-size:11px;color:var(--mut);background:var(--acs);white-space:nowrap;overflow:hidden}
.edit .ct{cursor:move}
.bd{flex:1;display:flex;padding:6px;overflow:hidden;min-width:0;min-height:0}.bd.row{flex-direction:row;align-items:center}.bd.col{flex-direction:column;align-items:stretch}
.rz{display:none;position:absolute;right:0;bottom:0;width:24px;height:24px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--ac) 50%);border-radius:0 0 5px 0;touch-action:none}.edit .rz{display:block}
.el{flex:none;display:flex;align-items:center;gap:5px;white-space:nowrap;min-width:0}
.el.g{flex:1 1 70px}.el.b{padding:5px 10px;border:1px solid var(--bd);border-radius:5px;background:var(--pn);justify-content:center}
.l-right{flex-direction:row-reverse}.l-top{flex-direction:column;gap:1px}.ic span{display:none}
.el i{font-style:normal}.el input[type=range]{flex:1;min-width:40px}.f.v{flex-direction:column;flex:0 0 auto;align-self:stretch}
.f.v input{writing-mode:vertical-lr;direction:rtl;min-height:30px}
.sw{width:28px;height:16px;border-radius:8px;background:var(--ac);position:relative}.sw:after{content:"";position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff}
.sep{background:var(--bd)}.row .sep{width:1px;align-self:stretch}.col .sep{height:1px}
.tabs span{padding:3px 9px;border-bottom:2px solid transparent}.tabs span:first-child{border-color:var(--ac)}
.score{align-self:stretch;min-height:40px;justify-content:center;color:var(--mut);border:1px dashed var(--bd);border-radius:4px;background:repeating-linear-gradient(transparent 0 14px,var(--bd) 14px 15px)}.col .score{flex:1 1 60px}
.el.sel{outline:2px solid var(--ac);outline-offset:1px}.edit .el *{pointer-events:none}.edit .el{cursor:grab}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:8px;width:min(640px,92vw)}dialog textarea{width:100%;height:46vh;box-sizing:border-box;font:12px ui-monospace,monospace}
.img{width:96px;height:72px;flex:none;overflow:hidden;justify-content:center;color:var(--mut);border:1px dashed var(--bd);border-radius:4px;background:var(--acs)}
.cxw{flex:none}.cx{position:relative;display:flex;align-items:stretch;border:1px solid var(--bd);border-radius:8px;background:var(--pn);box-shadow:0 4px 14px rgba(0,0,0,.18);overflow:hidden}
.cb{position:relative;padding:6px 12px;font-style:normal;cursor:pointer}.cb+.cb,.dr{border-left:1px solid var(--bd)}
.cb.on{box-shadow:inset 0 -3px 0 var(--ac);font-weight:600}.cb.on:after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.dr{display:flex;background:var(--acs);animation:sl .18s ease-out}@keyframes sl{from{opacity:0;transform:translateX(-16px)}}
#P textarea{width:100%;box-sizing:border-box;font:12px ui-monospace,monospace;color:var(--tx)}
html,body{overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{user-select:none;-webkit-user-select:none}input,textarea{user-select:text;-webkit-user-select:text}
button,select,input,label{touch-action:manipulation}
@media(pointer:coarse){header button,header select,header input,aside button,aside select,#P input{min-height:36px}.tc,.te{padding:9px 6px}.rz{width:34px;height:34px}.mv{width:56px;height:30px;line-height:30px}.h[data-h=r]{width:18px;right:-22px}.h[data-h=b]{height:18px;bottom:-22px}.h[data-h=c]{width:28px;height:28px;right:-22px;bottom:-22px}#stage{padding:20px 34px 34px 20px}}

</style>
</head>
<body>
<div id="app">
<header id="hd0">
 <div class="seg" id="devs"><button data-d="pc">PC</button><button data-d="tab">Tablette</button><button data-d="phone">Téléphone</button></div>
 <label>Largeur <input id="W" type="number" min="240" max="2700"></label>
 <label>Hauteur <input id="H" type="number" min="240" max="2700"></label>
 <select id="pre"></select><button id="rot" title="Pivoter">⟳</button>
 <button id="za" class="on" title="Ajuste le canevas à l'écran">Zoom auto</button><select id="zoom"><option value="1">100 %</option><option value=".75">75 %</option><option value=".5">50 %</option><option value=".25">25 %</option></select>
 <label><input id="prev" type="checkbox"> Aperçu</label>
 <button id="cp" title="Recopie les conteneurs du PC vers cet appareil (écrase)">Recopier depuis PC</button>
 <button id="ab">+ Ajouter</button><button id="tb">Structure</button><button id="un" title="Annuler (Ctrl+Z)">↶</button><button id="re" title="Rétablir (Ctrl+Maj+Z)">↷</button><span class="sp"></span><button id="zb" title="Clic : avancer · clic long : reculer">Plan</button><button id="pb">Propriétés</button><button id="io">Import / Export</button>
</header>
<div id="pop" hidden></div>
<main id="stage"><div id="wrap"><div id="cv"></div><i class="h" data-h="r"></i><i class="h" data-h="b"></i><i class="h" data-h="c"></i></div></main>
<aside id="P"></aside>
</div>
<dialog id="dlg">
 <h3>Import / Export du layout (JSON)</h3>
 <textarea id="txt" spellcheck="false"></textarea>
 <div class="r2" style="margin-top:8px"><button id="cpy">Copier</button><button id="imp">Importer ce JSON</button><button id="cls">Fermer</button></div>
 <input id="file" type="file" accept=".json,application/json"> <small id="msg"></small>
</dialog>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const NM={pc:'PC',tab:'tablette',phone:'téléphone'};
const TY=[['button','Bouton'],['toggle','Bascule'],['fader','Fader linéaire'],['select','Liste déroulante'],['input','Champ de saisie'],['label','Libellé'],['sep','Séparateur'],['tabs','Onglets'],['score','Zone partition'],['image','Zone image'],['ctxbar','Barre contextuelle à tiroir']];
const LB={button:'Bouton',toggle:'Option',fader:'Volume',select:'Choix',input:'Champ',label:'Texte',sep:'',tabs:'Un,Deux,Trois',score:'Partition',image:'Image',ctxbar:''};
const PRE={pc:[[1280,720],[1440,900],[1920,1080],[2560,1440],[2700,1500]],tab:[[768,1024],[820,1180],[1024,768],[1180,820]],phone:[[360,640],[390,844],[430,932],[844,390]]};
const cv=$('cv'),P=$('P');
let S,D='pc',sel={c:null,e:null},drag=null,lock=0,zs=1,prev=false,showP=false,U=[],R=[],zauto=true;
const rep=(k,v)=>k[0]=='_'?undefined:v;
const save=()=>{try{localStorage.setItem('lb1',JSON.stringify(S,rep))}catch(e){}};
const snap=()=>{const j=JSON.stringify(S,rep);if(U[U.length-1]!==j){U.push(j);if(U.length>100)U.shift()}R=[]};
const restore=j=>{S=JSON.parse(j);if(sel.c&&!cur())sel={c:null,e:null};else if(sel.e&&!curE())sel.e=null};
function undo(){if(!U.length)return;R.push(JSON.stringify(S,rep));restore(U.pop());ui()}
function redo(){if(!R.length)return;U.push(JSON.stringify(S,rep));restore(R.pop());ui()}
const zlist=()=>S.containers.map((x,i)=>[x,i]).filter(a=>a[0].dev[D]).sort((a,b)=>(a[0].dev[D].z||0)-(b[0].dev[D].z||0)||a[1]-b[1]).map(a=>a[0]);
function zmove(dir){
 const c=cur();if(!c)return;const L=zlist(),i=L.indexOf(c),j=i+dir;if(j<0||j>=L.length)return;
 snap();L.splice(i,1);L.splice(j,0,c);L.forEach((x,k)=>x.dev[D].z=k);ui()}
const dv=()=>S.devices[D],cur=()=>S.containers.find(c=>c.id==sel.c),curE=()=>{const c=cur();return c&&c.items.find(e=>e.id==sel.e)};
const allE=()=>S.containers.flatMap(c=>c.items);
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'')||'sans_nom';
function uniq(n,list,self){let b=n,i=1;while(list.some(o=>o!==self&&o.name==n))n=b+'_'+(++i);return n}
const cl=v=>Math.round(Math.max(240,Math.min(2700,v||240)));

/* ---------- géométrie : marges ancrées (null = non ancré) ---------- */
function rect(g,W,H){
 let x,y,w=g.w,h=g.h;
 if(g.l!=null&&g.r!=null){x=g.l;w=W-g.l-g.r}else if(g.r!=null)x=W-g.r-w;else x=g.l??0;
 if(g.t!=null&&g.b!=null){y=g.t;h=H-g.t-g.b}else if(g.b!=null)y=H-g.b-h;else y=g.t??0;
 return{x,y,w:Math.max(40,w),h:Math.max(30,h)}}
function setRect(g,r,W,H){
 g.w=Math.round(r.w);g.h=Math.round(r.h);
 if(g.r!=null)g.r=Math.round(W-r.x-r.w);if(g.l!=null||g.r==null)g.l=Math.round(r.x);
 if(g.b!=null)g.b=Math.round(H-r.y-r.h);if(g.t!=null||g.b==null)g.t=Math.round(r.y)}
function setAnchor(g,ax,v){
 const{w:W,h:H}=dv(),r=rect(g,W,H);
 if(ax=='h'){g.l=v.includes('l')?Math.round(r.x):null;g.r=v.includes('r')?Math.round(W-r.x-r.w):null;g.w=Math.round(r.w)}
 else{g.t=v.includes('t')?Math.round(r.y):null;g.b=v.includes('b')?Math.round(H-r.y-r.h):null;g.h=Math.round(r.h)}}
function scaleFrom(k){
 const a=S.devices.pc,b=S.devices[k],sx=b.w/a.w,sy=b.h/a.h;
 S.containers.forEach(c=>{const g={...c.dev.pc};
  ['l','r'].forEach(p=>g[p]!=null&&(g[p]=Math.round(g[p]*sx)));['t','b'].forEach(p=>g[p]!=null&&(g[p]=Math.round(g[p]*sy)));
  g.w=Math.max(60,Math.min(g.w,b.w-16));g.h=Math.max(40,Math.min(g.h,b.h-16));c.dev[k]=g})}

/* ---------- rendu ---------- */
const ctx={};
const parse=t=>String(t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const[a,b]=l.split('=');return{n:a.trim(),ch:b?b.split(',').map(x=>x.trim()).filter(Boolean):[]}});
function elHTML(e,icm){
 const L=esc(e.label),I=e.icon?`<i>${esc(e.icon)}</i>`:'',t=e.type;let c='el',x='';
 if(t=='button'){c+=` b l-${e.lay}`;x=I+`<span>${L}</span>`}
 else if(t=='toggle')x=`<span>${L}</span><b class="sw"></b>`;
 else if(t=='fader'){c+=` g f${e.vert?' v':''}`;x=`<span>${L}</span><input type="range">`}
 else if(t=='select'){c+=' g';x=`<span>${L}</span><select><option>…</option></select>`}
 else if(t=='input'){c+=' g';x=`${I}<input placeholder="${L}">`}
 else if(t=='label')x=I+`<span>${L}</span>`;
 else if(t=='sep')c+=' sep';
 else if(t=='tabs'){c+=' tabs';x=L.split(',').map(s=>`<span>${s}</span>`).join('')}
 else if(t=='score'){c+=' g score';x=`<span>${L}</span>`}
 else if(t=='image'){c+=' img';x=e.src?`<img src="${esc(e.src)}" alt="" style="width:100%;height:100%;object-fit:${e.fit||'contain'}">`:`<span>${L}</span>`}
 else if(t=='ctxbar'){c+=' cxw';const rows=parse(e.items),o=Math.min(rows.length,ctx[e.id]??(e.pv|0));
  x='<div class="cx">'+(o?[[rows[o-1],o-1]]:rows.map((r,i)=>[r,i])).map(([r,i])=>`<em class="cb${o&&i==o-1?' on':''}" data-r="${i}">${esc(r.n)}</em>`).join('')+(o?'<div class="dr">'+rows[o-1].ch.map((q,j)=>`<em class="cb" data-s="${j}">${esc(q)}</em>`).join('')+'</div>':'')+'</div>'}
 if(icm&&(t!='button'||e.icon))c+=' ic';
 if(e.id==sel.e)c+=' sel';
 const z=(e.sz&&e.sz[D])||{},st=(z.w?`width:${z.w}px;flex:none;`:'')+(z.h?`height:${z.h}px;`:'')+(z.fz?`font-size:${z.fz}px;`:'');
 return`<div class="${c}" data-e="${e.id}"${st?` style="${st}"`:''}>${x}</div>`}
function sc(){return zauto?Math.max(.1,Math.min(1,($('stage').clientWidth-56)/dv().w,($('stage').clientHeight-56)/dv().h)):+$('zoom').value}
function render(){
 const{w:W,h:H}=dv(),s=lock||sc();zs=s;
 $('wrap').style.cssText=`width:${W*s}px;height:${H*s}px`;
 cv.style.cssText=`width:${W}px;height:${H}px;transform:scale(${s})`;
 cv.className=prev?'':'edit';
 cv.innerHTML=S.containers.map(c=>{
  const g=c.dev[D];if(!g||g.vis===false)return'';
  const r=rect(g,W,H),small=(g.thr>0&&r.w<g.thr)||(g.thh>0&&r.h<g.thh);
  if(small&&g.mode=='hide')return'';
  const fold=small&&g.mode=='fold',ic=small&&g.mode=='icons',fs=g.fs||34;
  if(fold){r.x=g.l==null&&g.r!=null?W-g.r-fs:(g.l??0);r.y=g.t==null&&g.b!=null?H-g.b-fs:(g.t??0);r.w=r.h=fs}
  const its=c.items.filter(e=>e.vis[D]!==false);
  return`<div class="ct${fold?' fold':''}${c.id==sel.c&&!sel.e?' sel':''}" data-c="${c.id}" title="${esc(c.name)}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;z-index:${g.z||0}"><div class="bd ${g.dir}" style="gap:${g.gap}px">${(fold?its.slice(0,1):its).map(e=>elHTML(e,ic||fold)).join('')}</div>${fold?'':'<div class="rz"></div>'}${c.id==sel.c?`<div class="mv ${r.y>=34?'up':H-r.y-r.h>=34?'dn':'in'}">✥</div>`:''}</div>`}).join('');
 fit()}
function fit(){ /* repli progressif, du dernier élément au premier */
 cv.querySelectorAll('.ct').forEach(ct=>{
  const bd=ct.querySelector('.bd');if(!bd)return;
  const c=S.containers.find(x=>x.id==ct.dataset.c),els=[...bd.children],E=n=>c.items.find(e=>e.id==n.dataset.e);
  const over=()=>bd.scrollWidth>bd.clientWidth+1||bd.scrollHeight>bd.clientHeight+1;
  for(let i=els.length-1;i>=0&&over();i--){const e=E(els[i]);
   if(e.col=='item')els[i].style.display='none';
   else if(e.col=='wrap')els[i].classList.add('l-top');
   else if(e.type!='button'||e.icon)els[i].classList.add('ic')}
  for(let i=els.length-1;i>=0&&over();i--)if(els[i].classList.contains('l-top')&&(E(els[i]).icon))els[i].classList.add('ic')})}

/* ---------- panneaux ---------- */
function F(l,k,v,t='text',o){
 let i;
 if(t=='sel')i=`<select data-k="${k}">${o.map(([a,b])=>`<option value="${a}"${a==v?' selected':''}>${esc(b)}</option>`).join('')}</select>`;
 else if(t=='area')i=`<textarea data-k="${k}" rows="5">${esc(v)}</textarea>`;
 else if(t=='chk')i=`<input type="checkbox" data-k="${k}"${v?' checked':''}>`;
 else i=`<input type="${t}" data-k="${k}" value="${esc(v)}">`;
 return`<label${t=='chk'?' class="k"':''}>${t=='chk'?i+l:l+i}</label>`}
function treeHTML(){return S.containers.map(c=>`<div class="tc${c.id==sel.c&&!sel.e?' on':''}${c.dev[D]?.vis===false?' dim':''}" data-c="${c.id}">▣ ${esc(c.name)}</div>`+c.items.map(e=>`<div class="te${e.id==sel.e?' on':''}${e.vis[D]===false?' dim':''}" data-c="${c.id}" data-e="${e.id}">${esc(e.name)} <small>${e.type}</small></div>`).join('')).join('')||'<p class="mut">Ajoute un conteneur pour commencer.</p>'}
function props(){
 const c=cur(),e=curE();
 if(!c){P.innerHTML='<p class="mut">Sélectionne un conteneur ou un élément, sur le canevas ou dans la liste.</p>';return}
 const g=c.dev[D],d=dv(),r=rect(g,d.w,d.h),z0=(e&&e.sz&&e.sz[D])||{};
 const ah=g.l!=null&&g.r!=null?'lr':g.r!=null?'r':'l',av=g.t!=null&&g.b!=null?'tb':g.b!=null?'b':'t';
 let h='';
 if(e)h+=`<section><h3>Élément <small>dans ${esc(c.name)}</small></h3>`+F('Nom (identifiant)','e.name',e.name)+F('Type','e.type',e.type,'sel',TY)
